<style>
/* Layout: sticky chapter bar → one chapter at a time (max 980px reading column) → prev/next footer */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #172030; --muted: #5a6475; --line: #dde2ea; --soft: #eef1f5;
  --accent: #155e8b; --accent-ink: #ffffff; --key: #fff7e6; --key-line: #e9c46a;
  --up: #b23a2e; --down: #1f63a8; --holiday: rgba(214,140,40,.15);
  --s1: #155e8b; --s2: #c27a1a; --s3: #2e8b68; --s4: #7b4fb3; --s5: #8b95a7; --s6: #c2416b;
  --f-body: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --panel: #19202a; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3441; --soft: #202834;
  --accent: #6fb0e0; --accent-ink: #0d1520; --key: #2a2416; --key-line: #8a6d2c;
  --up: #f08479; --down: #7cb0ea; --holiday: rgba(224,160,70,.16);
  --s1: #6fb0e0; --s2: #e0a24c; --s3: #5cc39b; --s4: #b08ae0; --s5: #8f99ab; --s6: #e3789b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #19202a; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3441; --soft: #202834;
  --accent: #6fb0e0; --accent-ink: #0d1520; --key: #2a2416; --key-line: #8a6d2c;
  --up: #f08479; --down: #7cb0ea; --holiday: rgba(224,160,70,.16);
  --s1: #6fb0e0; --s2: #e0a24c; --s3: #5cc39b; --s4: #b08ae0; --s5: #8f99ab; --s6: #e3789b; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7; margin: 0; font-feature-settings: 'tnum'; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.bar-in { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; }
.meta { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tabs button { flex: 0 0 auto; font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.tabs button .n { font-family: var(--f-num); color: var(--muted); margin-right: 5px; font-size: 12px; }
.tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button[aria-current="true"] .n { color: inherit; opacity: .8; }
.tabs button:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.subnav { display: flex; flex-wrap: wrap; gap: 6px; }
.subnav button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }

<script>
(function () {
const D = JSON.parse(document.getElementById('data').textContent);
const W = D.weeks, Y = D.yoy;
const fI = (v) => v == null ? '—' : Math.round(v).toLocaleString('ko-KR');
const f1 = (v) => v == null ? '—' : v.toFixed(1);
const f2 = (v) => v == null ? '—' : v.toFixed(2);
const fP = (v) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(1) + '%';
const fS = (v) => (v * 100).toFixed(1) + '%';
const ch = (a, b) => (a ? b / a - 1 : null);
const LW = (a, b, f) => { const s = W.slice(W.findIndex((r) => r.wk === a), W.findIndex((r) => r.wk === b) + 1); return s.reduce((x, r) => x + r[f], 0) / s.length; };
const LY = (a, b, f) => { const i = W.findIndex((r) => r.wk === a), j = W.findIndex((r) => r.wk === b); const s = Y.slice(i, j + 1); return s.reduce((x, r) => x + r[f], 0) / s.length; };
const LI = (k) => D.trackL.findIndex((r) => r.k === k);
const LM = (a, b, f) => { const s = D.trackL.slice(LI(a), LI(b) + 1); return s.reduce((x, r) => x + r[f], 0) / s.length; };
const LR = (a, b) => { const s = D.trackL.slice(LI(a), LI(b) + 1).filter((r) => { const w = W.find((x) => x.wk === r.k); return !(w && String(w.holiday).startsWith('추석')); }).map((r) => r.avg); return [Math.min(...s), Math.max(...s)]; };
const cls = (v) => v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : '';
const P = (v) => `<span class="${cls(v)}">${fP(v)}</span>`;
const sum = (a) => a.reduce((x, y) => x + y, 0);
const avg = (rows, k) => sum(rows.map((r) => r[k])) / rows.length;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const period = (wk) => { const d = new Date(wk + 'T00:00:00'), e = new Date(d); e.setDate(d.getDate() + 6); const f = (x) => (x.getMonth() + 1) + '/' + x.getDate(); return f(d) + '~' + f(e); };

function table(head, rows, opt = {}) {
  const f0 = rows.length ? (rows[0].cells || rows[0]) : [];
  const th = head.map((h, i) => `<th${f0[i] && typeof f0[i] === 'object' && f0[i].t ? ' style="text-align:left"' : ''}>${h}</th>`).join('');

}
