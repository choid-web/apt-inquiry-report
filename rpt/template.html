/* weekly helpers */
const IDX = W.map((_, i) => i).reverse();
const wow = (k, i) => (i > 0 ? ch(W[i - 1][k], W[i][k]) : null);
const wlab = (r) => r.label + (r.holiday ? ` <span class="tag">${r.holiday}</span>` : '');
function wtable(title, groups, opt = {}) {
  const top = `<tr><th></th><th></th>${groups.map((g) => `<th colspan="${g.cols.length}" style="text-align:center;color:var(--ink)">${g.g}</th>`).join('')}</tr>`;
  const head = `<tr><th>주차</th><th>기간</th>${groups.flatMap((g) => g.cols.map((c) => `<th>${c.h}</th>`)).join('')}</tr>`;
  const body = IDX.map((i) => { const r = W[i]; return `<tr${r.holiday ? ' class="hol"' : ''}><td>${wlab(r)}</td><td>${period(r.wk)}</td>${groups.flatMap((g) => g.cols.map((c) => `<td>${c.v(i)}</td>`)).join('')}</tr>`; }).join('');
  return `<div class="panel">${title ? `<h3>${title}</h3>` : ''}<div class="tw wk"><table><thead>${top}${head}</thead><tbody>${body}</tbody></table></div>${opt.note ? `<p class="note">${opt.note}</p>` : ''}</div>`;
}
const cV = (k, f = fI) => ({ h: '건수', v: (i) => f(W[i][k]) });
const cW = (k) => ({ h: 'WoW', v: (i) => P(wow(k, i)) });
const cY = (k25, k26) => ({ h: 'YoY', v: (i) => P(ch(Y[i][k25], Y[i][k26])) });
const grp = (g, k, y) => ({ g, cols: [{ h: '2026', v: (i) => fI(W[i][k]) }, cW(k), ...(y ? [cY(y + '25', y + '26')] : [])] });
function regionBlock(id, title, fields, note) {
  const btns = D.REG.map((rg, j) => `<button type="button" data-rg="${rg}" aria-pressed="${j === 0}">${rg}</button>`).join('');
  return `<div class="panel"><h3>${title}</h3><div class="seg" id="${id}-seg">${btns}</div><div class="tw wk" id="${id}"></div>${note ? `<p class="note">${note}</p>` : ''}</div>`;
}
function regionWire(id, fields) {
  const seg = document.getElementById(id + '-seg'), out = document.getElementById(id);
  const render = (rg) => {
    const head = `<tr><th>주차</th><th>기간</th>${fields.flatMap((f) => [`<th>${f.n}</th>`, '<th>WoW</th>']).join('')}</tr>`;
    const body = IDX.map((i) => { const r = W[i], cur = D.reg[r.wk][rg], prv = i > 0 ? D.reg[W[i - 1].wk][rg] : null;
      return `<tr${r.holiday ? ' class="hol"' : ''}><td>${wlab(r)}</td><td>${period(r.wk)}</td>${fields.flatMap((f) => [`<td>${fI(f.v(cur))}</td>`, `<td>${P(prv ? ch(f.v(prv), f.v(cur)) : null)}</td>`]).join('')}</tr>`; }).join('');
    out.innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
    [...seg.children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.rg === rg));
  };
  seg.onclick = (e) => { const b = e.target.closest('button'); if (b) render(b.dataset.rg); };
  render(D.REG[0]);
}
